<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Potemkin 3D Luxor temple real-time WebGL walkthrough with parallax occlusion relief, weathering, dust shafts and streamed 4K textures." />
    <title>Luxor temple · Potemkin 3D</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; --z-canvas: 0; --z-hud: 10; }
      html, body { margin: 0; width: 100%; height: 100dvh; background: #0b0b0c; overflow: hidden; }
      main { width: 100%; height: 100dvh; }
      canvas { display: block; width: 100vw; height: 100dvh; }
      #hud {
        position: fixed;
        left: max(16px, env(safe-area-inset-left));
        bottom: max(16px, env(safe-area-inset-bottom));
        z-index: var(--z-hud);
        max-width: calc(100vw - 112px);
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid rgba(205, 201, 189, 0.16);
        background: rgba(11, 11, 12, 0.74);
        font: 12px/1.58 ui-monospace, SFMono-Regular, Menlo, monospace;
        font-variant-numeric: tabular-nums;
        color: #f0eee5;
        user-select: none;
        white-space: pre;
        overflow-x: auto;
      }
      #hud b { color: #ffffff; font-weight: 600; }
      #hud .off { color: #a9a598; }
      #msg {
        position: fixed; inset: 0; display: grid; place-items: center;
        color: #cdc9bd; font: 400 15px/1.4 ui-sans-serif, system-ui, sans-serif; text-wrap: pretty;
      }
      @media (max-width: 640px) {
        #hud { font-size: 11px; max-height: 34dvh; overflow-y: auto; }
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="view" role="img" aria-label="Luxor temple 3D walkthrough"></canvas>
    </main>
    <div id="msg" role="status" aria-live="polite">Loading the temple…</div>
    <div id="hud" hidden></div>
    <script type="module" src="./view.js"></script>
  </body>
</html>
