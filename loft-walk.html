<!doctype html>
<html lang="en" data-run="loft-props">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Potemkin 3D</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b0c; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #hud {
        position: fixed; left: 16px; bottom: 14px; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: rgba(255, 255, 255, 0.78); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8); user-select: none; white-space: pre;
      }
      #hud b { color: #fff; font-weight: 600; }
      #hud .off { color: rgba(255, 255, 255, 0.35); }
      #msg { position: fixed; inset: 0; display: grid; place-items: center; color: rgba(255, 255, 255, 0.7); font: 14px ui-sans-serif, system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="msg">loading the loft…</div>
    <div id="hud" hidden></div>
    <script type="module" src="/src/demo/loftwalk.js"></script>
  </body>
</html>
